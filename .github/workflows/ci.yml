name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `npm audit` resolves against a live advisory database, so the Security
  # audit job below is only as current as its last run. On push/PR alone,
  # main is never re-evaluated after it lands: a commit that passed the
  # gate in July is not necessarily passing today, and nothing re-runs to
  # say so. The weekly cron closes that gap.
  schedule:
    # Weekly Monday 07:23 UTC. Deliberately off the hour — GitHub delays
    # scheduled runs during the high-load window at the top of each hour.
    - cron: '23 7 * * 1'
  # On-demand re-evaluation, e.g. to check main against today's advisories
  # without waiting for the cron.
  workflow_dispatch:

# Least privilege: CI only ever reads the repo. Overrides whatever the
# repository-wide default GITHUB_TOKEN scope is set to.
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail only on high/critical advisories in shipped (production) deps.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
